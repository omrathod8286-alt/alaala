name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.lock
      - run: npm --prefix frontend ci && npm --prefix chaincode ci
      - run: cd backend && ../.venv/bin/ruff check app tests && ../.venv/bin/ruff format --check app tests && ../.venv/bin/pytest -q
      - run: npm --prefix frontend run build && npm --prefix chaincode run build && npm --prefix chaincode test
      - run: npm --prefix frontend audit --audit-level=high && npm --prefix chaincode audit --audit-level=high
      - run: .venv/bin/pip install pip-audit && .venv/bin/pip-audit -r backend/requirements.lock
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          python scripts/setup.py
          cd backend
          ../.venv/bin/uvicorn app.main:app --env-file ../.env --port 8000 &
          cd ../frontend
          npm run dev &
          npx playwright test
